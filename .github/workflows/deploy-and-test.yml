name: Deploy and Test

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Countries separated by comma. Example: CO,PE,MX"
        required: true
        default: "CO"
        type: string

      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - pro

      app_version:
        description: "Application version"
        required: true
        default: "1.0.0"
        type: string

      cucumber_tags:
        description: "Cucumber tags (optional - overrides country tag)"
        required: false
        default: ""
        type: string

jobs:

  # ==========================================================
  # 1. BUILD
  # ==========================================================
  build:
    name: "1. Build Application"
    runs-on: ubuntu-latest

    steps:
      - name: Build application
        shell: bash
        run: |
          echo "========================================"
          echo " PIPELINE DE DESPLIEGUE - DROPI APP"
          echo "========================================"
          echo "App Version = ${{ inputs.app_version }}"
          echo "Countries   = ${{ inputs.countries }}"
          echo "Environment = ${{ inputs.environment }}"
          echo "----------------------------------------"

          echo "[build] Compilando aplicacion..."
          sleep 2

          echo "[build] Build completado exitosamente"


  # ==========================================================
  # 2. DEPLOY
  # ==========================================================
  deploy:
    name: "2. Deploy to Environment"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy application
        shell: bash
        run: |
          echo "[deploy] Desplegando version ${{ inputs.app_version }} \
          en ${{ inputs.environment }} \
          (${{ inputs.countries }})..."

          sleep 3

          echo "[deploy] Health check..."
          sleep 1

          echo "[deploy] Despliegue completado."


  # ==========================================================
  # 3. TRIGGER QA
  # ==========================================================
  trigger-qa:
    name: "3. Trigger QA Automation"
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Trigger QA workflows and wait for results
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QA_GITHUB_TOKEN_DROPI }}
          # ==========================================================
          # GH_TOKEN para repo ribarr1: QA_GITHUB_TOKEN
          # ==========================================================
          COUNTRIES: ${{ inputs.countries }}
          TEST_ENV: ${{ inputs.environment }}
          CUSTOM_TAGS: ${{ inputs.cucumber_tags }}

        #  QA_OWNER="ribarr1"   QA_REPO="gsqai_dropi_automation"  QA_WORKFLOW="run-smoke.yml"
        run: |
          set -euo pipefail

          QA_OWNER="DROPI-SAS"
          QA_REPO="dropi-test-atm"
          QA_WORKFLOW="qa-smoke-tests.yml"
          QA_BRANCH="develop"
          QA_API_VERSION="2022-11-28"
          POLL_INTERVAL_SECONDS=15
          RUN_DISCOVERY_TIMEOUT_SECONDS=600
          RESULT_TIMEOUT_SECONDS=3600

          echo "========================================"
          echo " QA AUTOMATION"
          echo "========================================"
          echo "Countries   = $COUNTRIES"
          echo "Environment = $TEST_ENV"
          echo "----------------------------------------"

          if [ -z "$GH_TOKEN" ]; then
            echo "[qa] ERROR: no existe el secreto QA_GITHUB_TOKEN_DROPI"
            exit 1
          fi

          COUNTRIES_LIST=$(echo "$COUNTRIES" | tr ',' ' ')

          if [ -z "$(echo "$COUNTRIES_LIST" | tr -d '[:space:]')" ]; then
            echo "[qa] ERROR: debe especificarse al menos un pais"
            exit 1
          fi

          > /tmp/qa_runs.txt

          # ==================================================
          # DISPARAR TODOS LOS PAISES
          # ==================================================

          for C in $COUNTRIES_LIST; do

            C=$(echo "$C" | tr -d ' ' | tr '[:lower:]' '[:upper:]')

            case "$C" in
              CO) TAG="@col" ;;
              PE) TAG="@pe" ;;
              MX) TAG="@mx" ;;
              EC) TAG="@ec" ;;
              CL) TAG="@cl" ;;
              PA) TAG="@pa" ;;
              AR) TAG="@ar" ;;
              VE) TAG="@ve" ;;
              CR) TAG="@cr" ;;
              GT) TAG="@gt" ;;
              PY) TAG="@py" ;;
              *)
                echo "[qa] ERROR: Pais no soportado: $C"
                exit 1
                ;;
            esac

            # Si CUCUMBER_TAGS fue enviado explícitamente,
            # tiene prioridad sobre el tag del país.
            if [ -n "$CUSTOM_TAGS" ]; then
              TAG="$CUSTOM_TAGS"
            fi

            echo ""
            echo "[qa] Disparando:"
            echo "     COUNTRY=$C"
            echo "     ENV=$TEST_ENV"
            echo "     TAG=$TAG"

            DISPATCHED_AT=$(date -u +%s)
            PAYLOAD=$(jq -n \
              --arg ref "$QA_BRANCH" \
              --arg country "$C" \
              --arg environment "$TEST_ENV" \
              --arg cucumber_tags "$TAG" \
              '{
                ref: $ref,
                inputs: {
                  country: $country,
                  environment: $environment,
                  cucumber_tags: $cucumber_tags,
                  reporting_iteration_id: "1"
                }
              }')

            DISPATCH_RESPONSE=$(curl --fail-with-body -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: $QA_API_VERSION" \
              "https://api.github.com/repos/$QA_OWNER/$QA_REPO/actions/workflows/$QA_WORKFLOW/dispatches" \
              -d "$PAYLOAD")

            if [ -n "$DISPATCH_RESPONSE" ]; then
              echo "[qa] Respuesta inesperada del dispatch: $DISPATCH_RESPONSE"
            fi

            RUN_ID=""
            DISCOVERY_DEADLINE=$((DISPATCHED_AT + RUN_DISCOVERY_TIMEOUT_SECONDS))

            # workflow_dispatch responde 204 y no devuelve el run creado.
            # Buscamos el run nuevo por workflow, rama y fecha de creacion.
            while [ -z "$RUN_ID" ] && [ "$(date -u +%s)" -lt "$DISCOVERY_DEADLINE" ]; do
              RUNS_RESPONSE=$(curl --fail-with-body -sS \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: $QA_API_VERSION" \
                "https://api.github.com/repos/$QA_OWNER/$QA_REPO/actions/workflows/$QA_WORKFLOW/runs?branch=$QA_BRANCH&event=workflow_dispatch&per_page=20")

              RUN_ID=$(echo "$RUNS_RESPONSE" | jq -r --argjson dispatched_at "$DISPATCHED_AT" '
                [.workflow_runs[]
                  | select((.created_at | fromdateiso8601) >= $dispatched_at)]
                | max_by(.created_at)
                | .id // empty
              ')

              if [ -z "$RUN_ID" ]; then
                sleep "$POLL_INTERVAL_SECONDS"
              fi
            done

            if [ -z "$RUN_ID" ]; then
              echo "[qa] ERROR: no se encontro el run de QA para $C dentro del timeout"
              exit 1
            fi

            RUN_URL="https://github.com/$QA_OWNER/$QA_REPO/actions/runs/$RUN_ID"

            echo "[qa] Workflow creado."
            echo "[qa] Run ID: $RUN_ID"
            echo "[qa] URL: $RUN_URL"

            echo "$C $RUN_ID" >> /tmp/qa_runs.txt

          done


          echo ""
          echo "========================================"
          echo " Todos los workflows fueron disparados"
          echo " Esperando resultados..."
          echo "========================================"

          OVERALL_RESULT="SUCCESS"


          # ==================================================
          # ESPERAR RESULTADOS
          # ==================================================

          while read -r COUNTRY RUN_ID; do

            echo ""
            echo "[qa] Esperando resultado de $COUNTRY..."
            echo "[qa] Run ID: $RUN_ID"

            RESULT_DEADLINE=$(($(date -u +%s) + RESULT_TIMEOUT_SECONDS))

            while [ "$(date -u +%s)" -lt "$RESULT_DEADLINE" ]; do

              RESPONSE=$(curl --fail-with-body -sS \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: $QA_API_VERSION" \
                "https://api.github.com/repos/$QA_OWNER/$QA_REPO/actions/runs/$RUN_ID")

              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
              CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion // ""')

              echo "[qa] $COUNTRY status=$STATUS conclusion=$CONCLUSION"

              if [ "$STATUS" = "completed" ]; then
                break
              fi

              if [ "$STATUS" = "unknown" ]; then
                echo "[qa] ERROR consultando workflow $RUN_ID"
                echo "$RESPONSE"
                OVERALL_RESULT="FAILED"
                break
              fi

              sleep "$POLL_INTERVAL_SECONDS"

            done

            if [ "$STATUS" != "completed" ]; then
              echo "[qa] ERROR: timeout esperando el workflow $RUN_ID"
              OVERALL_RESULT="FAILED"
            fi

            echo ""
            echo "[qa] $COUNTRY finalizado: $CONCLUSION"

            if [ "$CONCLUSION" != "success" ]; then
              OVERALL_RESULT="FAILED"
            fi

          done < /tmp/qa_runs.txt


          # ==================================================
          # RESULTADO GLOBAL
          # ==================================================

          echo ""
          echo "========================================"
          echo " Resultado global QA: $OVERALL_RESULT"
          echo "========================================"

          if [ "$OVERALL_RESULT" != "SUCCESS" ]; then
            echo "[qa] FALLO: uno o mas paises no pasaron las pruebas."
            echo "[qa] Despliegue NO aprobado."
            exit 1
          fi

          echo "[qa] Todas las pruebas QA fueron exitosas."
          echo "[qa] Despliegue aprobado."